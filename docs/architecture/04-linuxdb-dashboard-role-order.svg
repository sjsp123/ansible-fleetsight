<svg viewBox="0 0 720 250" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Role orchestration for playbooks/linuxdb_dashboard.yml and playbooks/hostinfo.yml, showing which roles each playbook runs and in what order.</title>
<desc>hostinfo.yml runs the hostinfo role once against all hosts. linuxdb_dashboard.yml runs linuxdb_reports and config_snapshot on log_clients in parallel, then the linuxdb_dashboard role on log_collector, which reads all three data sources.</desc>
<rect width="100%" height="100%" fill="#F7F6F2"/>
<defs>
<marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#B9B6AE" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="20" y="20" width="220" height="90" rx="6" fill="#F9F8F5" stroke="#D4D1CA" stroke-width="0.5"/>
<rect x="20" y="130" width="220" height="100" rx="6" fill="#F9F8F5" stroke="#D4D1CA" stroke-width="0.5"/>
<rect x="300" y="60" width="250" height="140" rx="6" fill="#EFF7F7" stroke="#01696F" stroke-width="0.75"/>

<line x1="240" y1="65" x2="296" y2="90" stroke="#B9B6AE" stroke-width="1" marker-end="url(#arrow3)"/>
<line x1="240" y1="180" x2="296" y2="170" stroke="#B9B6AE" stroke-width="1" marker-end="url(#arrow3)"/>

<text x="130" y="52" text-anchor="middle" font-size="12" font-weight="600" fill="#28251D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">hostinfo.yml</text>
<text x="130" y="68" text-anchor="middle" font-size="10" fill="#7A7974" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">role: hostinfo</text>
<text x="130" y="84" text-anchor="middle" font-size="10" fill="#7A7974" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">target_host=all</text>
<text x="130" y="98" text-anchor="middle" font-size="10" fill="#BAB9B4" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">-> hostinfo.csv</text>

<text x="130" y="154" text-anchor="middle" font-size="12" font-weight="600" fill="#28251D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">linuxdb_dashboard.yml</text>
<text x="130" y="170" text-anchor="middle" font-size="10" fill="#7A7974" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">step 1 · log_clients</text>
<text x="130" y="190" text-anchor="middle" font-size="10" fill="#28251D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">linuxdb_reports</text>
<text x="130" y="204" text-anchor="middle" font-size="10" fill="#28251D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">config_snapshot</text>
<text x="130" y="220" text-anchor="middle" font-size="9" fill="#BAB9B4" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">(run in parallel)</text>

<text x="425" y="85" text-anchor="middle" font-size="12" font-weight="600" fill="#28251D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">linuxdb_dashboard.yml</text>
<text x="425" y="101" text-anchor="middle" font-size="10" fill="#7A7974" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">step 2 · log_collector</text>
<text x="425" y="120" text-anchor="middle" font-size="10" fill="#28251D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">role: linuxdb_dashboard</text>
<text x="425" y="138" text-anchor="middle" font-size="10" fill="#7A7974" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">reads hostinfo.csv +</text>
<text x="425" y="152" text-anchor="middle" font-size="10" fill="#7A7974" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">reports + snapshots</text>
<text x="425" y="170" text-anchor="middle" font-size="10" fill="#BAB9B4" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">:8082 -> browser</text>
</svg>
