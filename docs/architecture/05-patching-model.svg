<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Patching model: three tiered strategies - standard fleet hosts (batched, auto-reboot), IdM servers (serial with service verification), and the AAP controller (health-gated, no auto-reboot) - all appending patching history on the collector.</title>
<desc>Three lanes, one per patching class. Standard fleet hosts patch in batches and auto-reboot when required. IdM servers patch one master at a time with a 3600-second return window and post-reboot verification of directory, Kerberos and CA services. The AAP controller patches without auto-reboot by policy, gated by pre- and post-health checks of its container roster. Every lane appends a record to the patching history CSV on the collector via the log_collector delegation pattern.</desc>
<rect width="100%" height="100%" fill="#F7F6F2"/>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#B9B6AE" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- Content source -->
<rect x="180" y="24" width="360" height="46" rx="6" fill="#EFF7F7" stroke="#01696F" stroke-width="0.75"/>
<text x="360" y="44" text-anchor="middle" font-size="12" font-weight="600" fill="#01696F" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Satellite 6.19 — content source</text>
<text x="360" y="60" text-anchor="middle" font-size="10" fill="#7A7974" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">register_fleet.yml — Global Registration (repeatable)</text>

<line x1="300" y1="72" x2="122" y2="108" stroke="#B9B6AE" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="360" y1="72" x2="360" y2="108" stroke="#B9B6AE" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="420" y1="72" x2="598" y2="108" stroke="#B9B6AE" stroke-width="1" marker-end="url(#arrow)"/>

