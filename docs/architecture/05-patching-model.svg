<text x="516" y="150" font-size="10" fill="#7A7974" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">patching_aap.yml</text>

<circle cx="522" cy="176" r="3.5" fill="#01696F"/>
<text x="534" y="180" font-size="11" fill="#28251D" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">pre gate: container roster</text>
