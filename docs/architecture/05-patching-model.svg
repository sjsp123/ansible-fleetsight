<text x="534" y="208" font-size="11" fill="#964219" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">patch — no auto-reboot</text>
<text x="534" y="224" font-size="10" fill="#7A7974" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">(policy: protect the running job)</text>
<circle cx="522" cy="248" r="3.5" fill="#01696F"/>
<text x="534" y="252" font-size="11" fill="#28251D" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">post gate: platform checks</text>
<text x="534" y="266" font-size="10" fill="#BAB9B4" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">needs-restarting - manual bounce</text>

<!-- History feed -->
<line x1="120" y1="294" x2="120" y2="314" stroke="#B9B6AE" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="360" y1="294" x2="360" y2="314" stroke="#B9B6AE" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="600" y1="294" x2="600" y2="314" stroke="#B9B6AE" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="20" y="318" width="680" height="62" rx="6" fill="#EFF7F7" stroke="#01696F" stroke-width="0.75"/>
<text x="40" y="340" font-size="12" font-weight="600" fill="#01696F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">patching_history</text>
<text x="40" y="358" font-size="11" fill="#28251D" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">appended on the collector via the log_collector delegation pattern — every patch run, every lane, one record each</text>
<text x="40" y="374" font-size="11" fill="#7A7974" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">-> /linuxdb/patching/ansible_patching_history.csv (Hostname, Date, Installed, Updated, Removed)</text>
</svg>
