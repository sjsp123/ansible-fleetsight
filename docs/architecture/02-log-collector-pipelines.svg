<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Detail of the two pipelines running on the Log Collector host: the centralized logging pipeline and the LinuxDB dashboard pipeline.</title>
<desc>Centralized logging: rsyslog_collector writes to log_db and flat files, log_search_ui reads log_db, and six watcher/alerter roles poll log_db or actively check hosts and email via Postfix. LinuxDB dashboard: hostinfo, linuxdb_reports and config_snapshot roles write to the control node, which the linuxdb_dashboard role reads and serves to a browser.</desc>
<rect width="100%" height="100%" fill="#F7F6F2"/>
<defs>
<marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#B9B6AE" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="20" y="18" font-size="12" font-weight="600" fill="#01696F" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Centralized Logging pipeline</text>

<rect x="20" y="30" width="130" height="130" rx="6" fill="#F9F8F5" stroke="#D4D1CA" stroke-width="0.5"/>
<rect x="170" y="30" width="110" height="130" rx="6" fill="#F9F8F5" stroke="#D4D1CA" stroke-width="0.5"/>
<rect x="320" y="30" width="120" height="50" rx="6" fill="#F9F8F5" stroke="#D4D1CA" stroke-width="0.5"/>
<rect x="320" y="90" width="120" height="70" rx="6" fill="#F9F8F5" stroke="#D4D1CA" stroke-width="0.5"/>
<rect x="485" y="90" width="100" height="70" rx="6" fill="#EFF7F7" stroke="#01696F" stroke-width="0.75"/>

<line x1="150" y1="95" x2="166" y2="95" stroke="#B9B6AE" stroke-width="1" marker-end="url(#arrow2)"/>
<line x1="280" y1="80" x2="316" y2="55" stroke="#B9B6AE" stroke-width="1" marker-end="url(#arrow2)"/>
<line x1="280" y1="110" x2="316" y2="125" stroke="#B9B6AE" stroke-width="1" marker-end="url(#arrow2)"/>
<line x1="440" y1="125" x2="481" y2="125" stroke="#B9B6AE" stroke-width="1" marker-end="url(#arrow2)"/>
<text x="298" y="60" text-anchor="middle" font-size="9" fill="#BAB9B4" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">reads</text>
<text x="298" y="122" text-anchor="middle" font-size="9" fill="#BAB9B4" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">polls</text>
<text x="460" y="118" text-anchor="middle" font-size="9" fill="#BAB9B4" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">SMTP</text>

<text x="85" y="55" text-anchor="middle" font-size="11" font-weight="600" fill="#28251D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">rsyslog_</text>
<text x="85" y="69" text-anchor="middle" font-size="11" font-weight="600" fill="#28251D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">collector</text>
<text x="85" y="88" text-anchor="middle" font-size="10" fill="#7A7974" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">TCP :6514</text>
<text x="85" y="108" text-anchor="middle" font-size="10" fill="#7A7974" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">writes flat files</text>
<text x="85" y="122" text-anchor="middle" font-size="10" fill="#7A7974" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">+ log_db (if on)</text>

<text x="225" y="55" text-anchor="middle" font-size="12" font-weight="600" fill="#28251D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">log_db</text>
<text x="225" y="71" text-anchor="middle" font-size="10" fill="#7A7974" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">(PostgreSQL)</text>
<text x="225" y="94" text-anchor="middle" font-size="10" fill="#7A7974" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">table: syslog</text>
<text x="225" y="108" text-anchor="middle" font-size="10" fill="#7A7974" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">read-only role</text>

<text x="380" y="50" text-anchor="middle" font-size="11" font-weight="600" fill="#28251D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">log_search_ui</text>
<text x="380" y="66" text-anchor="middle" font-size="10" fill="#7A7974" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">:8081 -> browser</text>

<text x="380" y="108" text-anchor="middle" font-size="11" font-weight="600" fill="#28251D" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Watchers (6)</text>
<text x="380" y="124" text-anchor="middle" font-size="10" fill="#7A7974" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">log_alerter + 5</text>
<text x="380" y="138" text-anchor="middle" font-size="10" fill="#7A7974" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">polls &amp; checks</text>

<text x="535" y="118" text-anchor="middle" font-size="12" font-weight="600" fill="#28251D" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Email</text>
<text x="535" y="134" text-anchor="middle" font-size="10" fill="#7A7974" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">via Postfix</text>

<text x="20" y="192" font-size="12" font-weight="600" fill="#01696F" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">LinuxDB Dashboard pipeline</text>

<rect x="20" y="205" width="190" height="120" rx="6" fill="#F9F8F5" stroke="#D4D1CA" stroke-width="0.5"/>
<rect x="230" y="205" width="190" height="120" rx="6" fill="#EFF7F7" stroke="#01696F" stroke-width="0.75"/>
<rect x="440" y="205" width="180" height="120" rx="6" fill="#F9F8F5" stroke="#D4D1CA" stroke-width="0.5"/>

<line x1="210" y1="265" x2="226" y2="265" stroke="#B9B6AE" stroke-width="1" marker-end="url(#arrow2)"/>
<line x1="420" y1="265" x2="436" y2="265" stroke="#B9B6AE" stroke-width="1" marker-end="url(#arrow2)"/>

<text x="115" y="230" text-anchor="middle" font-size="12" font-weight="600" fill="#28251D" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Collection roles</text>
<text x="115" y="252" text-anchor="middle" font-size="10" fill="#7A7974" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">hostinfo</text>
<text x="115" y="268" text-anchor="middle" font-size="10" fill="#7A7974" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">linuxdb_reports</text>
<text x="115" y="284" text-anchor="middle" font-size="10" fill="#7A7974" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">config_snapshot</text>
<text x="115" y="306" text-anchor="middle" font-size="10" fill="#BAB9B4" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">(runs on log_clients)</text>

<text x="325" y="230" text-anchor="middle" font-size="12" font-weight="600" fill="#28251D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">linuxdb_dashboard</text>
<text x="325" y="248" text-anchor="middle" font-size="10" fill="#7A7974" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">:8082</text>
<text x="325" y="266" text-anchor="middle" font-size="10" fill="#7A7974" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">reads /linuxdb/*</text>
<text x="325" y="284" text-anchor="middle" font-size="10" fill="#BAB9B4" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">saved via delegate_to:</text>
<text x="325" y="298" text-anchor="middle" font-size="10" fill="#BAB9B4" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">localhost = this host</text>

<text x="530" y="230" text-anchor="middle" font-size="12" font-weight="600" fill="#28251D" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Browser</text>
<text x="530" y="248" text-anchor="middle" font-size="10" fill="#7A7974" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">:8082</text>
<text x="530" y="266" text-anchor="middle" font-size="10" fill="#7A7974" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">(same auth as</text>
<text x="530" y="280" text-anchor="middle" font-size="10" fill="#7A7974" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">log_search_ui)</text>
</svg>
