# inventory.ini — canonical lab inventory (committed)
#
# Single source of truth for BOTH execution paths:
#   - admin1.lab.example.com (CLI development workstation): repo
#     ansible.cfg points at this file.
#   - aap27.lab.example.com (AAP 2.7 controller): the "lab-infra"
#     inventory is sourced from this project file, so the controller
#     always sees the same groups and hosts as local CLI runs.
#
# Design rules (changed 2026-10-18):
#   - Hosts are listed by FQDN only. No execution-context vars: the old
#     `ansible_connection=local` on the collector is gone — admin1 is
#     now managed over SSH like every other host, so any control node
#     (admin1 CLI or the AAP controller) can execute against it
#     identically. True per-host properties live in host_vars/
#     (e.g. host_vars/admin1.yml: rsyslog_collector_advertise_host).
#   - Groups required by the repo's roles/playbooks:
#       [log_collector]  exactly ONE host — the central rsyslog
#                        collector, also the base for the linuxdb
#                        dashboard and log search UI (asserted by
#                        roles/rsyslog_collector and roles/rsyslog_client).
#       [log_clients]    every host that forwards logs to the collector
#                        (children include below).
#       [idm]            IdM/FreeIPA server(s) — used by
#                        playbooks/idm_healthcheck.yml and
#                        roles/idm_healthcheck_watch. An ADDITIONAL
#                        membership: idm1 is also in [servers].
#       [homelab]        must mirror [servers] exactly, same FQDNs —
#                        playbooks/silence_setroubleshoot.yml asserts
#                        membership as its environment scope guard.
#
# 2026-10-18: aap27 (the new AAP 2.7 controller) joined [servers] and
# [homelab] so it is patched, monitored and logged like every other
# host — its logs flow to the collector like the rest of the fleet.

[log_collector]
admin1.lab.example.com

[servers]
admin1.lab.example.com
aap1.lab.example.com
idm1.lab.example.com
client1.lab.example.com
nfs1.lab.example.com
aap27.lab.example.com

# Every host in [servers] also forwards its logs to the collector.
[log_clients:children]
servers

[idm]
idm1.lab.example.com

[aap_servers]
aap27.lab.example.com

[lab]
aap1.lab.example.com
idm1.lab.example.com
client1.lab.example.com
nfs1.lab.example.com

[homelab]
admin1.lab.example.com
aap1.lab.example.com
idm1.lab.example.com
client1.lab.example.com
nfs1.lab.example.com
aap27.lab.example.com

[work]

# Connection identity for every host in the lab. The controller's EE
# does not run as the lab service account, so remote_user must come
# from the inventory, not from the invoking user (local CLI runs would
# otherwise default to the invoking user - same result, but now it is
# explicit and identical on both execution paths).
[all:vars]
ansible_user=svc_ansible

# --- Optional groups kept from the example inventory ------------------
# [hpe_ilo_hosts]: hosts playbooks/collect_ilo.yml runs against (HPE
# ProLiant/rack servers with ipmitool/ilorest/ssacli available) — also
# used by playbooks/system_poweroff.yml for BMC-verified power-off.
#
# Per-realm time-server groups (timesync): see rhel_system_roles/
# README.md "Per-realm NTP configuration" — chrony_ntp_servers per
# group via group_vars/<group>/site_hosts.yml; never set it in an INI
# :vars block (inline values are strings and can be overridden by
# group_vars/all).
