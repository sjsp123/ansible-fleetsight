---
# group_vars/all/disk_space_watcher.yml
# Fleet-wide overrides for roles/disk_space_watcher (see that role's
# defaults/main.yml for the full variable list). Uncomment/edit as
# needed - this follows the same pattern as
# group_vars/all/service_failure_watcher.yml.

# Opt-in toggle - defaults to false/off in roles/disk_space_watcher's
# own defaults; this file flips it on for
# playbooks/centralized_logging.yml. Only ever applies to
# [log_collector] - it is a no-op on [log_clients].
disk_space_watcher_enabled: true

# disk_space_watcher_poll_interval_seconds: 60
# disk_space_watcher_max_rows_per_email: 50
# disk_space_watcher_email_to: root
# See roles/disk_space_watcher/README.md "Mail delivery" - this always
# relays through the collector's OWN local mail transport agent (e.g.
# admin1's Postfix), never an external SMTP relay directly.
