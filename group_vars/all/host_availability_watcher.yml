---
# group_vars/all/host_availability_watcher.yml
# Fleet-wide overrides for roles/host_availability_watcher (see that
# role's defaults/main.yml for the full variable list). Uncomment/edit
# as needed - this follows the same pattern as
# group_vars/all/service_failure_watcher.yml.

# Opt-in toggle - defaults to false/off in roles/host_availability_watcher's
# own defaults; this file flips it on for playbooks/centralized_logging.yml.
# Only ever applies to [log_collector] - it is a no-op on [log_clients].
host_availability_watcher_enabled: true

# host_availability_watcher_poll_interval_seconds: 60
# host_availability_watcher_consecutive_failures_threshold: 2
# host_availability_watcher_email_to: root
# See roles/host_availability_watcher/README.md "Mail delivery" - this
# always relays through the collector's OWN local mail transport agent
# (e.g. admin1's Postfix), never an external SMTP relay directly.
