---
# roles/disk_space_watcher/tasks/main.yml
#
# Deploys a small stdlib+psycopg2 poller that emails an alert whenever
# a new "disk_space_check: filesystem ..." row lands in log_db -
# roles/disk_space_check's own fixed wording for a disk-space/inode
# threshold breach, from any host already forwarding logs to this
# collector - see README.md. Only ever run against [log_collector].

- name: Install python3-psycopg2 (RHEL BaseOS/AppStream - same package roles/log_db already installs)
  ansible.builtin.package:
    name: python3-psycopg2
    state: present
  become: true

- name: Create the unprivileged disk_space_watcher system account
  ansible.builtin.user:
    name: "{{ disk_space_watcher_user }}"
    system: true
    shell: /sbin/nologin
    home: "{{ disk_space_watcher_app_dir }}"
    create_home: false
  become: true

- name: Create the app and state directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ disk_space_watcher_user }}"
    group: "{{ disk_space_watcher_user }}"
    mode: "0750"
  loop:
    - "{{ disk_space_watcher_app_dir }}"
    - "{{ disk_space_watcher_state_dir }}"
  become: true

- name: Deploy the config file
  ansible.builtin.template:
    src: config.py.j2
    dest: "{{ disk_space_watcher_app_dir }}/config.py"
    owner: "{{ disk_space_watcher_user }}"
    group: "{{ disk_space_watcher_user }}"
    mode: "0640"
  become: true

- name: Deploy the poller script
  ansible.builtin.copy:
    src: disk_space_watcher.py
    dest: "{{ disk_space_watcher_app_dir }}/disk_space_watcher.py"
    owner: "{{ disk_space_watcher_user }}"
    group: "{{ disk_space_watcher_user }}"
    mode: "0750"
  become: true

- name: Deploy the systemd service unit
  ansible.builtin.template:
    src: disk-space-watcher.service.j2
    dest: /etc/systemd/system/disk-space-watcher.service
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload systemd

- name: Deploy the systemd timer unit
  ansible.builtin.template:
    src: disk-space-watcher.timer.j2
    dest: /etc/systemd/system/disk-space-watcher.timer
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload systemd

- name: Apply systemd unit changes now
  ansible.builtin.meta: flush_handlers

- name: Enable and start the disk-space-watcher timer
  ansible.builtin.systemd:
    name: disk-space-watcher.timer
    state: started
    enabled: true
  become: true
