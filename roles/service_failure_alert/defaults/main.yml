---
# roles/service_failure_alert/defaults/main.yml
#
# Real-time alerting for systemd unit failures, using systemd's own
# OnFailure= mechanism - the moment a covered unit enters the "failed"
# state, an email fires immediately. No polling wait, no dependency on
# the next hostinfo/linuxdb_reports cron run - this exists specifically
# to close that gap for the services the dashboard already tracks (see
# roles/linuxdb_dashboard's SERVICE_STATUS_COLUMNS and the Overview
# traffic light).
#
# Opt-in, matching the pattern used by roles/log_db, roles/log_search_ui,
# etc: this role's own default is false; group_vars/all/service_failure_
# alert.yml flips it on fleet-wide by default in this repo.
service_failure_alert_enabled: false

# Units checked with `systemctl is-active` on EVERY host (see
# group_vars/all/host_checks.yml's chronyd_status check) get an
# OnFailure= hook unconditionally.
service_failure_alert_always_units:
  - chronyd.service

# Extend this list yourself (group_vars or -e) to cover more units
# fleet-wide - e.g. sshd.service, firewalld.service, auditd.service,
# crond.service (all already tracked by svr_check.sh's FAILED_SVC_CNT,
# just not previously wired to fire the instant they fail rather than
# at the next linuxdb_reports cron run).
service_failure_alert_extra_units: []

# rsm222.service / rsm232.service are only added on hosts already in
# rsm222_hosts / rsm232_hosts (group_vars/all/host_checks.yml /
# group_vars/all/site_hosts.yml) - the SAME lists host_checks.yml
# itself uses, reused here rather than duplicated, so there is one
# source of truth for "which hosts run RSM222/232". FLEXLM is
# deliberately NOT covered: host_checks.yml checks it with
# `pgrep -f lmgrd`, not a systemd unit, so there is no systemd "failed"
# state to hook OnFailure= onto - see README.md "What this does not
# cover".

# Mail delivery - see README.md "Mail delivery": this always talks to
# the LOCAL mail transport agent on service_failure_alert_smtp_host,
# never an external relay directly, so no relay credentials are needed
# or stored here. Default recipient "root" relies on that already
# being routed somewhere useful on this host (e.g. /etc/aliases, or a
# Postfix relayhost already configured outside Ansible) - override to
# a real address here if that is not the case on a given host.
service_failure_alert_email_to: root
service_failure_alert_email_from: "rhel-alerts@{{ ansible_fqdn | default(ansible_hostname) }}"
service_failure_alert_smtp_host: localhost
service_failure_alert_smtp_port: 25

service_failure_alert_script_path: /usr/local/sbin/service_failure_alert.py
