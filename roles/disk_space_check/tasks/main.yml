---
# roles/disk_space_check/tasks/main.yml
#
# Deploys a small stdlib-only local check that walks every real
# (non-pseudo) mounted filesystem on THIS host and logs one syslog
# message per breach of the configured disk-space/inode thresholds -
# picked up by roles/rsyslog_client's existing imjournal forwarding
# (already enabled fleet-wide) and consumed centrally by
# roles/disk_space_watcher on [log_collector]. Deployed to every
# [log_clients] host - see README.md.

- name: Create the unprivileged disk_space_check system account
  ansible.builtin.user:
    name: "{{ disk_space_check_user }}"
    system: true
    shell: /sbin/nologin
    home: "{{ disk_space_check_app_dir }}"
    create_home: false
  become: true

- name: Create the app directory
  ansible.builtin.file:
    path: "{{ disk_space_check_app_dir }}"
    state: directory
    owner: "{{ disk_space_check_user }}"
    group: "{{ disk_space_check_user }}"
    mode: "0750"
  become: true

- name: Deploy the config file
  ansible.builtin.template:
    src: config.py.j2
    dest: "{{ disk_space_check_app_dir }}/config.py"
    owner: "{{ disk_space_check_user }}"
    group: "{{ disk_space_check_user }}"
    mode: "0640"
  become: true

- name: Deploy the check script
  ansible.builtin.copy:
    src: disk_space_check.py
    dest: "{{ disk_space_check_app_dir }}/disk_space_check.py"
    owner: "{{ disk_space_check_user }}"
    group: "{{ disk_space_check_user }}"
    mode: "0750"
  become: true

- name: Deploy the systemd service unit
  ansible.builtin.template:
    src: disk-space-check.service.j2
    dest: /etc/systemd/system/disk-space-check.service
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload systemd

- name: Deploy the systemd timer unit
  ansible.builtin.template:
    src: disk-space-check.timer.j2
    dest: /etc/systemd/system/disk-space-check.timer
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload systemd

- name: Apply systemd unit changes now
  ansible.builtin.meta: flush_handlers

- name: Enable and start the disk-space-check timer
  ansible.builtin.systemd:
    name: disk-space-check.timer
    state: started
    enabled: true
  become: true
