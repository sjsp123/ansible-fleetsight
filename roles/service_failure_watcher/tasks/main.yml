---
# roles/service_failure_watcher/tasks/main.yml
#
# Deploys a small stdlib+psycopg2 poller that emails an alert whenever
# a new "<unit>: Failed with result '<reason>'." row lands in log_db -
# systemd's own universal wording for any unit entering the failed
# state, from any host already forwarding logs to this collector - see
# README.md. Only ever run against [log_collector].

- name: Install python3-psycopg2 (RHEL BaseOS/AppStream - same package roles/log_db already installs)
  ansible.builtin.package:
    name: python3-psycopg2
    state: present
  become: true

- name: Create the unprivileged service_failure_watcher system account
  ansible.builtin.user:
    name: "{{ service_failure_watcher_user }}"
    system: true
    shell: /sbin/nologin
    home: "{{ service_failure_watcher_app_dir }}"
    create_home: false
  become: true

- name: Create the app and state directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ service_failure_watcher_user }}"
    group: "{{ service_failure_watcher_user }}"
    mode: "0750"
  loop:
    - "{{ service_failure_watcher_app_dir }}"
    - "{{ service_failure_watcher_state_dir }}"
  become: true

- name: Deploy the config file
  ansible.builtin.template:
    src: config.py.j2
    dest: "{{ service_failure_watcher_app_dir }}/config.py"
    owner: "{{ service_failure_watcher_user }}"
    group: "{{ service_failure_watcher_user }}"
    mode: "0640"
  become: true

- name: Deploy the poller script
  ansible.builtin.copy:
    src: service_failure_watcher.py
    dest: "{{ service_failure_watcher_app_dir }}/service_failure_watcher.py"
    owner: "{{ service_failure_watcher_user }}"
    group: "{{ service_failure_watcher_user }}"
    mode: "0750"
  become: true

- name: Deploy the systemd service unit
  ansible.builtin.template:
    src: service-failure-watcher.service.j2
    dest: /etc/systemd/system/service-failure-watcher.service
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload systemd

- name: Deploy the systemd timer unit
  ansible.builtin.template:
    src: service-failure-watcher.timer.j2
    dest: /etc/systemd/system/service-failure-watcher.timer
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload systemd

- name: Apply systemd unit changes now
  ansible.builtin.meta: flush_handlers

- name: Enable and start the service-failure-watcher timer
  ansible.builtin.systemd:
    name: service-failure-watcher.timer
    state: started
    enabled: true
  become: true
