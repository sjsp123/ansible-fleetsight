---
# roles/chrony_watcher/tasks/main.yml
#
# Deploys a small stdlib+psycopg2 poller that emails an alert whenever
# a new "chrony_check: ..." row lands in log_db - roles/chrony_check's
# own fixed wording for an NTP/chrony breach, from any host already
# forwarding logs to this collector - see README.md. Only ever run
# against [log_collector].

- name: Install python3-psycopg2 (RHEL BaseOS/AppStream - same package roles/log_db already installs)
  ansible.builtin.package:
    name: python3-psycopg2
    state: present
  become: true

- name: Create the unprivileged chrony_watcher system account
  ansible.builtin.user:
    name: "{{ chrony_watcher_user }}"
    system: true
    shell: /sbin/nologin
    home: "{{ chrony_watcher_app_dir }}"
    create_home: false
  become: true

- name: Create the app and state directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ chrony_watcher_user }}"
    group: "{{ chrony_watcher_user }}"
    mode: "0750"
  loop:
    - "{{ chrony_watcher_app_dir }}"
    - "{{ chrony_watcher_state_dir }}"
  become: true

- name: Deploy the config file
  ansible.builtin.template:
    src: config.py.j2
    dest: "{{ chrony_watcher_app_dir }}/config.py"
    owner: "{{ chrony_watcher_user }}"
    group: "{{ chrony_watcher_user }}"
    mode: "0640"
  become: true

- name: Deploy the poller script
  ansible.builtin.copy:
    src: chrony_watcher.py
    dest: "{{ chrony_watcher_app_dir }}/chrony_watcher.py"
    owner: "{{ chrony_watcher_user }}"
    group: "{{ chrony_watcher_user }}"
    mode: "0750"
  become: true

- name: Deploy the systemd service unit
  ansible.builtin.template:
    src: chrony-watcher.service.j2
    dest: /etc/systemd/system/chrony-watcher.service
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload systemd

- name: Deploy the systemd timer unit
  ansible.builtin.template:
    src: chrony-watcher.timer.j2
    dest: /etc/systemd/system/chrony-watcher.timer
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload systemd

- name: Apply systemd unit changes now
  ansible.builtin.meta: flush_handlers

- name: Enable and start the chrony-watcher timer
  ansible.builtin.systemd:
    name: chrony-watcher.timer
    state: started
    enabled: true
  become: true
