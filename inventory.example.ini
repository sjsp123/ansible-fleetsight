# inventory.example.ini
#
# Template inventory for this repo. Copy to `inventory` (or
# `inventory.ini` — anything matching the `inventory` path set in
# ansible.cfg) and fill in your real hostnames. The real `inventory`
# file is gitignored on purpose — it's environment-specific and
# shouldn't be committed.
#
#   cp inventory.example.ini inventory
#
# Three groups are required by this repo's roles/playbooks:
#   [log_collector]   exactly ONE host — the central rsyslog collector,
#                      also the base for the linuxdb dashboard and log
#                      search UI (roles/rsyslog_collector asserts this
#                      group is non-empty; roles/rsyslog_client asserts
#                      it exists and has exactly one host).
#   [log_clients]      every host that should forward logs to the
#                      collector — typically all hosts in [servers],
#                      via the `:children` include below.
#   [idm]              every IdM/FreeIPA server — the lab typically has
#                      exactly ONE (no replication); either shape is
#                      fine, the group just needs at least one host.
#                      Used by
#                      playbooks/idm_healthcheck.yml (ad hoc / post-patch
#                      checks) and by roles/idm_healthcheck_watch (the
#                      periodic local check wired into
#                      playbooks/centralized_logging.yml).

[log_collector]
# Real address the collector listens on and clients connect to.
admin1.lab.example.com

# --- If the collector IS the Ansible control node itself -------------
# Uncomment this instead of the line above, and set
# rsyslog_collector_advertise_host to the address OTHER hosts use to
# reach it (required whenever ansible_connection=local is used — every
# client would otherwise try to forward logs to itself):
# localhost ansible_connection=local rsyslog_collector_advertise_host=admin1.lab.example.com

[servers]
admin1.lab.example.com
aap1.lab.example.com
idm1.lab.example.com
client1.lab.example.com
nfs1.lab.example.com

# Every host in [servers] also forwards its logs to the collector.
# Swap this for an explicit list of hostnames if you'd rather not have
# every [servers] host default into [log_clients].
[log_clients:children]
servers

# All IdM/FreeIPA server(s). REQUIRED — playbooks/idm_healthcheck.yml and
# roles/idm_healthcheck_watch both target this group directly. Every host
# here should also already be in [servers] above (so it's patched,
# monitored, and logged like every other host) — [idm] is an ADDITIONAL
# membership, not a replacement.
[idm]
idm1.lab.example.com

# --- Optional: role-specific groups used by other playbooks -----------
# See each playbook's own header comment / the relevant role README for
# whether it needs a dedicated group, or just runs against `all` /
# `--limit <host>`. Most playbooks in this repo (system_update,
# linuxdb_dashboard, hostinfo) run fine against `[servers]`/`all` with no
# dedicated group of their own.

# [hpe_ilo_hosts]
# Hosts playbooks/collect_ilo.yml runs against (HPE ProLiant/rack servers
# with ipmitool/ilorest/ssacli available) - see that playbook's header.
# Also the group playbooks/system_poweroff.yml uses to pick BMC-verified
# (iLO/IPMI) power-off checks over the weaker network-only check it falls
# back to for everything else - see roles/system_poweroff/README.md.
# admin1.lab.example.com

# --- Optional: per-realm time-server groups (timesync) ----------------
# playbooks/deploy_timesync_role.yml (redhat.rhel_system_roles.timesync)
# takes its NTP server list per host from the `chrony_ntp_servers`
# variable (the environment default is in the local
# group_vars/all/site_hosts.yml, via the `timesync_ntp_hostnames`
# default in group_vars/all/timesync.yml). If different hosts need
# DIFFERENT time servers — e.g. one list per IdM/AD realm — define one
# inventory group per realm and put a YAML list in
# group_vars/<realm_group>/site_hosts.yml. These group-specific files
# override group_vars/all/site_hosts.yml. Do NOT set this list in
# an INI :vars block: comma-separated values are strings, and an
# inline inventory value can be overridden by group_vars/all.
# See rhel_system_roles/README.md "Per-realm NTP configuration".
#
# Set `chrony_ntp_servers` in ONLY ONE group per host. If a host sits
# in two groups that both set it, Ansible's group-var merge order
# decides which one wins — for time sync you want exactly one source
# of truth per host.
#
# [realm_one]
# idm01.corp.example.com
# app01.corp.example.com
#
# [realm_two]
# idm01.other.example.com
#
# group_vars/realm_one/site_hosts.yml:
# chrony_ntp_servers:
#   - time.corp.example.com
#   - time1.corp.example.com
#
# group_vars/realm_two/site_hosts.yml:
# chrony_ntp_servers:
#   - time.other.example.com
#   - time1.other.example.com
#
# Deploy per realm: ansible-playbook playbooks/deploy_timesync_role.yml
# — enter the realm group name at the target_host prompt.

# --- Environment group (REQUIRED) --------------------------------------
# group_vars/homelab.yml applies to every host in the [homelab] group
# below. Put the collector (and any other locally-managed hosts) under
# [homelab] — leaving a host out of the group means it just gets plain
# role defaults, which is not something to rely on. See README.md
# "Environments" for what this currently covers.
#
# IMPORTANT: this means ALL locally-managed hosts, not just the
# collector — every host in [servers] above belongs in [homelab] too,
# mirrored exactly, same FQDNs. Some playbooks target this group
# directly as their "whole environment" scope guard (e.g.
# playbooks/silence_setroubleshoot.yml defaults to, and asserts
# membership in, `homelab` — a host left out of the group, or added
# under a different ad hoc group name, will fail that assert even
# though it's a perfectly good lab host).

[homelab]
# admin1.lab.example.com
# aap1.lab.example.com
# idm1.lab.example.com
# client1.lab.example.com
# nfs1.lab.example.com

# --- Per-host variable overrides --------------------------------------
# Prefer group_vars/all/*.yml or -e on the command line for most
# settings (see each role's README "Variables" section) — inline
# host vars here are best reserved for things that are genuinely
# per-host, like rsyslog_collector_advertise_host above.
