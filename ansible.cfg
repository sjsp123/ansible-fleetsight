[defaults]
inventory = ./inventory
ask_pass = False
host_key_checking = False
#gathering = explicit
pipelining = True
deprecation_warnings = True
gather_facts = True
roles_path = ./roles
# ./collections is this repo's own bundle (ansible.posix,
# community.postgresql). /usr/share/ansible/collections is the system
# path the `rhel-system-roles` RPM installs into (provides
# redhat.rhel_system_roles - see rhel_system_roles/README.md) - only
# resolved if that RPM is installed on the control node; harmless
# otherwise. Ansible searches collections_path entries in listed order.
collections_path = ./collections:/usr/share/ansible/collections
retry_files_enabled = False
intrepeter_python = auto_silent

# Vaulted files (e.g. group_vars/all/log_db_secrets.yml with real DB
# passwords) are always loaded for every host on every playbook run,
# regardless of which roles are actually enabled - so without this,
# EVERY playbook needs --ask-vault-pass, not just the ones that use
# vaulted vars. Points at a per-user, non-repo file so each admin
# creates their own local copy:
#   echo -n 'your-vault-password' > ~/.vault_pass && chmod 600 ~/.vault_pass
# Never commit that file - it lives outside this repo, in $HOME.
vault_password_file = ~/.vault_pass

[privilege_escalation]
become = True
ask_pass = False
become_method = sudo
become_user = root

