[defaults]
inventory = ./inventory.ini
ask_pass = False
host_key_checking = False
#gathering = explicit
pipelining = True
deprecation_warnings = True
gather_facts = True
roles_path = ./roles
# ./collections is this repo's own bundle (ansible.posix,
# community.postgresql). /usr/share/ansible/collections is the system
# path the `rhel-system-roles` RPM installs into (provides
# redhat.rhel_system_roles - see rhel_system_roles/README.md) - only
# resolved if that RPM is installed on the control node; harmless
# otherwise. Ansible searches collections_path entries in listed order.
collections_path = ./collections:/usr/share/ansible/collections
retry_files_enabled = False
intrepeter_python = auto_silent

# VAULT PASSWORDS are provided via the environment, NOT via this config
# file (changed 2026-10-18). Local admins set:
#   export ANSIBLE_VAULT_PASSWORD_FILE="$HOME/.vault_pass"
# (e.g. in ~/.bashrc, and explicitly in any cron/systemd-timer
# environment that runs ansible non-interactively). Create the file
# with:  echo -n 'your-vault-password' > ~/.vault_pass && chmod 600 ~/.vault_pass
# Never commit it - it lives outside this repo, in $HOME.
#
# Why not here: this ansible.cfg ships inside the AAP 2.7 controller's
# execution environments too (the project is cloned into the EE). Ansible
# eagerly reads a configured vault password file at CLI startup, so a
# hardwired $HOME path broke inventory-source imports in the EE (no such
# file exists there). On the controller, vault passwords are attached to
# job templates as Vault credentials instead - see the platform
# repo's build log. The committed repo contains no vaulted files; only
# per-host gitignored files (group_vars/all/*_secrets.yml,
# site_hosts.yml) are vaulted, and those exist only where they were
# created.
# vault_password_file = ~/.vault_pass   # <- local override only, if you
#                                        prefer cfg over env

[privilege_escalation]
become = True
ask_pass = False
become_method = sudo
become_user = root

