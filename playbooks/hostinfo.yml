---
- name: Host Information Report
  # target_host comes from extra-vars (CLI -e, wrapper script, or an AAP
  # controller survey answer). vars_prompt was removed 2026-10-19: without
  # a TTY (cron, AAP EE) it blocks forever waiting on stdin — the prompt
  # convenience is provided by the wrapper scripts at shell level instead.
  hosts: "{{ target_host | default('all') }}"
  gather_facts: true
  become: true

  vars:
    # Lives under /linuxdb (same convention as linuxdb_reports_data_dir
    # and config_snapshot_data_dir) so all three data sources the
    # linuxdb_dashboard reads sit side-by-side on the same mount instead
    # of hostinfo.csv being the odd one out under /var/tmp.
    host_report_csv_path: "/linuxdb/hostinfo"

  roles:
    - hostinfo
