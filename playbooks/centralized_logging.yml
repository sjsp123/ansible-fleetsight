- name: Verify end-to-end log forwarding from clients
  hosts: log_collector
  gather_facts: false
  become: true
  tags:
    - logging
    - log_forwarding_check
  vars:
    rsyslog_remote_log_dir: /var/log/remote
    rsyslog_forwarding_test_tag: rsyslog_forwarding_test
    rsyslog_forwarding_test_enabled: true
    rsyslog_forwarding_check_retries: 6
    rsyslog_forwarding_check_delay: 5

  tasks:
    # Only check hosts that actually ran the client role THIS invocation -
    # groups['log_clients'] always lists every inventory member regardless
    # of --limit, but hostvars only has rsyslog_forwarding_test_token (set
    # by roles/rsyslog_client) for hosts that were actually targeted this
    # run. Without this filter, running with e.g. --limit on just the
    # collector (as shown in README.md's opt-in log_db/log_search_ui
    # rollout examples) would crash here on undefined hostvars for the
    # clients that were skipped.
    - name: Determine which log_clients hosts actually ran in this invocation
      ansible.builtin.set_fact:
        rsyslog_forwarding_check_targets: >-
          {{ groups['log_clients']
             | map('extract', hostvars)
             | selectattr('rsyslog_forwarding_test_token', 'defined')
             | map(attribute='inventory_hostname')
             | list }}
      when: rsyslog_forwarding_test_enabled | bool

    - name: Check each client's test message arrived on the collector
      ansible.builtin.command:
        cmd: >-
          grep -q "rsyslog_forwarding_test_token={{ hostvars[item].rsyslog_forwarding_test_token }}"
          {{ rsyslog_remote_log_dir }}/{{ hostvars[item].ansible_hostname }}/{{ rsyslog_forwarding_test_tag }}.log
      register: rsyslog_forwarding_check
      loop: "{{ rsyslog_forwarding_check_targets | default([]) }}"
      retries: "{{ rsyslog_forwarding_check_retries }}"
      delay: "{{ rsyslog_forwarding_check_delay }}"
      until: rsyslog_forwarding_check.rc == 0
      changed_when: false
      failed_when: false
      when: rsyslog_forwarding_test_enabled | bool
      loop_control:
        label: "{{ item }}"

    - name: Report end-to-end forwarding verification results
      ansible.builtin.debug:
        msg: >-
          {{ item.item }}:
          {{ 'FORWARDING CONFIRMED - test message arrived on the collector.'
          if item.rc == 0 else
          'FORWARDING NOT CONFIRMED - test message did not arrive within the retry window ('
          ~ (rsyslog_forwarding_check_retries | int * rsyslog_forwarding_check_delay | int)
          ~ 's). Check network connectivity, firewalld, and rsyslog on ' ~ item.item ~ '.' }}
      loop: "{{ rsyslog_forwarding_check.results }}"
      when: rsyslog_forwarding_test_enabled | bool
      loop_control:
        label: "{{ item.item }}"

    - name: Fail if any client's forwarding test did not arrive
      ansible.builtin.assert:
        that:
          - rsyslog_forwarding_check.results | selectattr('rc', 'ne', 0) | list | length == 0
        success_msg: "End-to-end log forwarding CONFIRMED for all log_clients hosts."
        fail_msg: >-
          End-to-end log forwarding FAILED for:
          {{ rsyslog_forwarding_check.results | selectattr('rc', 'ne', 0) | map(attribute='item') | join(', ') }}
      when: rsyslog_forwarding_test_enabled | bool
